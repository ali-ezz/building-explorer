<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Building Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e13'/%3E%3Cg fill='none' stroke='%235aa9e6' stroke-width='2'%3E%3Crect x='6' y='13' width='9' height='13'/%3E%3Crect x='17' y='7' width='9' height='19'/%3E%3C/g%3E%3C/svg%3E">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<style>
/* Design: a technical instrument, not a brochure. Neutrals carry a slight blue bias
   to sit with satellite imagery; one accent for interaction; data QUALITY is encoded
   in colour so measured / estimated / unavailable are separable at a glance. */
:root{
  --bg:#0a0e13; --panel:#111820; --raise:#18212b; --line:#222d3a; --line-soft:#1a232d;
  --ink:#e7eef7; --dim:#8593a6; --faint:#5a6778;
  --accent:#4d9fe8; --accent-dim:#2b5f8c;
  --measured:#6fcf97; --estimated:#e0a34a; --absent:#5a6778;
  --radius:7px;
}
/* Light tokens, defined once and applied from either signal. The explicit
   data-theme attribute must WIN over the OS preference, in both directions -
   previously only the media query existed, so the toggle changed nothing. */
@media (prefers-color-scheme: light){
  :root:not([data-theme]){ --bg:#eef2f6; --panel:#fff; --raise:#f3f6f9; --line:#d8e0e8;
    --line-soft:#e6ecf2; --ink:#16202b; --dim:#5a6b7d; --faint:#8797a8; --accent:#1f6fb2; }
}
:root[data-theme="light"]{ --bg:#eef2f6; --panel:#fff; --raise:#f3f6f9; --line:#d8e0e8;
  --line-soft:#e6ecf2; --ink:#16202b; --dim:#5a6b7d; --faint:#8797a8; --accent:#1f6fb2; }
:root[data-theme="dark"]{ --bg:#0a0e13; --panel:#111820; --raise:#18212b; --line:#222d3a;
  --line-soft:#1a232d; --ink:#e7eef7; --dim:#8593a6; --faint:#5a6778; --accent:#4d9fe8; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:13.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
#app{display:flex;height:100%}
#map{flex:1;min-width:0}
aside{width:392px;flex:0 0 392px;background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
/* ---- phone / small tablet: full-bleed map with a draggable bottom sheet ----
   The previous layout gave the panel a fixed 52% of the screen, so the map was tiny
   and every record had to be scrolled inside a cramped box. Now the map fills the
   viewport and the sheet snaps between peek / half / full. */
@media (max-width:820px){
  #app{display:block;position:relative}
  #map{position:absolute;inset:0;height:100%}
  aside{
    position:absolute;left:0;right:0;bottom:0;width:auto;flex:none;
    height:var(--sheet,42vh);max-height:92vh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.35);
    transition:height .22s cubic-bezier(.4,0,.2,1);z-index:5;
  }
  .grab{display:block;padding:9px 0 5px;cursor:grab;touch-action:none;flex:none}
  .grab i{display:block;width:38px;height:4px;border-radius:99px;
    background:var(--line);margin:0 auto}
  header{padding:2px 16px 10px}
  h1{font-size:14px}
  .sub{display:none}
  .tools{padding:10px 16px;gap:9px}
  .row{gap:7px}
  /* MEASURED at 500 px wide: these were 33 px, not the ~44 px this block claimed.
     44 px is the smallest reliable touch target on both iOS and Android. */
  button{padding:0 10px;min-height:44px;font-size:13px;min-width:0}
  .field input{padding:0 11px;min-height:44px;font-size:16px} /* 16px stops iOS zoom */
  /* MapLibre's own controls ship at 29 px */
  .maplibregl-ctrl-group button{min-height:40px;width:40px}
  #status{padding:10px 16px}
  #body{padding:14px 16px 28px;-webkit-overflow-scrolling:touch}
  td{padding:11px 0}
  .s-item{padding:13px 11px}
  .legend{padding:10px 16px 14px}
  .maplibregl-ctrl-bottom-right{bottom:calc(var(--sheet,42vh) + 6px)}
  .maplibregl-ctrl-bottom-left{bottom:calc(var(--sheet,42vh) + 6px)}
  .maplibregl-ctrl-attrib.maplibregl-compact-show{max-width:calc(100vw - 24px)}
  .maplibregl-ctrl-top-left{top:6px}
}
@media (min-width:821px){ .grab{display:none} }
@media (hover:none){ button:hover{border-color:var(--line)} }

header{padding:15px 18px 13px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.sub{margin:3px 0 0;font-size:11.5px;color:var(--dim)}

.tools{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;
  flex-direction:column;gap:11px}
.field{position:relative}
.field input{width:100%;padding:9px 11px;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);font-size:13px;
  font-family:inherit;transition:border-color .12s}
.field input::placeholder{color:var(--faint)}
.field input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:30;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:none;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.s-item{padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.s-item:last-child{border-bottom:none}
.s-item:hover{background:var(--raise)}
.s-name{font-weight:600;font-size:12.5px}
.s-kind{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,transparent);padding:1px 5px;border-radius:3px}
.s-where{font-size:11px;color:var(--dim);width:100%}
.s-dim{color:var(--dim);cursor:default}
.field kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font:10px/1 ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);
  border-radius:3px;padding:3px 5px;pointer-events:none}
.field input:focus + kbd{opacity:0}

.yr{display:flex;align-items:center;gap:11px}
.yr label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;
  font-weight:600}
.yr output{margin-left:auto;font:600 13px/1 ui-monospace,monospace;color:var(--accent);
  font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:3px}

.capnote{font-size:10.5px;color:var(--estimated);min-height:0;line-height:1.4}
.capnote:empty{display:none}
.row{display:flex;gap:8px}
button{flex:1;padding:8px 10px;background:var(--raise);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);font:500 12px/1.2 inherit;
  cursor:pointer;transition:border-color .12s,background .12s}
button:hover{border-color:var(--accent-dim);background:var(--panel)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);border-color:var(--accent);color:#05121c;font-weight:600}

/* ---- layer stack ---- */
.lyrs{padding:11px 18px;border-bottom:1px solid var(--line)}
.lyrs h2{margin:0 0 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);font-weight:700}
.lyr{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:12px;
  user-select:none;-webkit-user-select:none}
.lyr:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.lyr .sw{width:13px;height:13px;border-radius:3px;border:1px solid var(--line);flex:none;
  position:relative;transition:background .12s,border-color .12s}
.lyr[aria-pressed="true"] .sw{background:var(--accent);border-color:var(--accent)}
.lyr[aria-pressed="true"] .sw::after{content:"";position:absolute;left:3.5px;top:1px;
  width:4px;height:7px;border:solid #05121c;border-width:0 2px 2px 0;transform:rotate(43deg)}
.lyr .src{margin-left:auto;font:9.5px/1 ui-monospace,monospace;color:var(--faint)}
.lyr .dot{width:8px;height:8px;border-radius:2px;flex:none}
@media (max-width:820px){ .lyr{padding:9px 0} .lyr .sw{width:16px;height:16px} }

#status{padding:11px 18px;border-bottom:1px solid var(--line);font-size:11.5px;
  color:var(--dim);line-height:1.6}
#status b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
#status a{color:var(--accent);text-decoration:none}
#status a:hover{text-decoration:underline}

#body{padding:16px 18px 22px;overflow-y:auto;flex:1}
.empty{color:var(--dim);font-size:12.5px;line-height:1.7}
.empty strong{color:var(--ink);font-weight:600}

.bid{font:600 12px/1.4 ui-monospace,monospace;margin:0 0 8px;color:var(--ink);
  word-break:break-all;letter-spacing:-.01em}
.chip{display:inline-block;font-size:9.5px;padding:3px 8px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.07em;font-weight:600;
  background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}

/* grouped readout */
.grp{margin-top:18px}
.grp h2{margin:0 0 2px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);font-weight:700}
table{width:100%;border-collapse:collapse}
td{padding:8px 0;border-bottom:1px solid var(--line-soft);vertical-align:baseline}
tr:last-child td{border-bottom:none}
td.k{color:var(--dim);width:47%;font-size:12.5px}
td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.num{font-family:ui-monospace,monospace;font-size:13px}

.tag{font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:2px 5px;
  border-radius:3px;margin-left:6px;font-weight:700;vertical-align:1px}
.t-est{color:var(--estimated);background:color-mix(in srgb,var(--estimated) 14%,transparent)}
.t-part{color:var(--estimated);background:color-mix(in srgb,var(--estimated) 14%,transparent)}
.na{color:var(--absent);font-style:italic;font-weight:400}
.why{display:block;text-align:left;color:var(--faint);font-size:10.5px;margin-top:4px;
  line-height:1.5;font-weight:400;font-variant-numeric:normal}

.note{margin-top:14px;padding:10px 12px;border-radius:var(--radius);font-size:11.5px;
  line-height:1.55;border-left:2px solid}
.note-warn{background:color-mix(in srgb,var(--estimated) 8%,transparent);
  border-color:var(--estimated);color:color-mix(in srgb,var(--estimated) 60%,var(--ink))}
.note-info{background:color-mix(in srgb,var(--accent) 7%,transparent);
  border-color:var(--accent);color:color-mix(in srgb,var(--accent) 55%,var(--ink))}

.skel{height:11px;border-radius:3px;background:linear-gradient(90deg,
  var(--line-soft) 25%,var(--line) 37%,var(--line-soft) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;display:inline-block;width:62px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

.legend{padding:11px 18px;border-top:1px solid var(--line);font-size:10.5px;
  color:var(--faint);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px}
.maplibregl-ctrl-attrib{font-size:9.5px}
.maplibregl-ctrl-attrib a{color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside>
    <div class="grab" id="grab" aria-label="Drag to resize panel"><i></i></div>
    <header>
      <h1>Global Building Explorer</h1>
      <p class="sub">Every building on Earth · streamed, not stored</p>
    </header>
    <div class="tools">
      <div class="field">
        <input type="text" id="place" placeholder="Search any place on Earth">
        <kbd>/</kbd>
      </div>
      <div class="yr">
        <label for="yr">Imagery</label>
        <input type="range" id="yr" min="0" max="12" value="12" step="1">
        <output id="yrv">2026</output>
      </div>
      <div class="capnote" id="capnote"></div>
      <div class="row">
        <button id="theme">Dark</button>
        <button id="labels">Labels</button>
      </div>
    </div>
    <div class="lyrs">
      <h2>Layers</h2>
      <div id="lyrlist"></div>
    </div>
    <div id="status">Loading…</div>
    <div id="body"><p class="empty"><strong>Click any building</strong> to read its record:
      footprint, neighbours, height, floors and population share — computed live,
      anywhere on Earth.</p></div>
    <div class="legend">
      <span><i style="background:var(--measured)"></i>measured</span>
      <span><i style="background:var(--estimated)"></i>estimated</span>
      <span><i style="background:var(--absent)"></i>unavailable</span>
      <span style="margin-left:auto"><a href="#" id="about" style="color:var(--dim)">About the data</a></span>
    </div>
  </aside>
</div>
<script>
const BASEMAPS = {"2014": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/5844/{level}/{row}/{col}", "2015": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/28163/{level}/{row}/{col}", "2016": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/18966/{level}/{row}/{col}", "2017": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/25521/{level}/{row}/{col}", "2018": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/23448/{level}/{row}/{col}", "2019": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/4756/{level}/{row}/{col}", "2020": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/29260/{level}/{row}/{col}", "2021": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/26120/{level}/{row}/{col}", "2022": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/45134/{level}/{row}/{col}", "2023": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/56102/{level}/{row}/{col}", "2024": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/16453/{level}/{row}/{col}", "2025": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/13192/{level}/{row}/{col}", "2026": "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/32246/{level}/{row}/{col}"};
const YEARS = Object.keys(BASEMAPS).map(Number).sort((a,b)=>a-b);
// MEASURED over one dense Imbaba bbox: Overture tiles 342 buildings, Overture exact
// parquet 367, our own direct GOB u MS fetch 728, and THIS source 1,071. It is the
// full Google + Microsoft union rather than a thinned conflation, 208 GB, maxzoom 15,
// and it carries bf_source, confidence and area_in_meters per building.
const PMT = 'https://data.source.coop/vida/google-microsoft-open-buildings/pmtiles/go_ms_building_footprints.pmtiles';
const BLD_LAYER = 'building_footprints';
// MEASURED per max-zoom tile: VIDA carries 3,208 buildings over Imbaba but ZERO in
// Beijing and Shanghai, and only 84/147/142 in Berlin/Paris/New York - Google Open
// Buildings does not cover China or most of the global north. Overture has 3,819 in
// Beijing and 5,118 in Paris via OpenStreetMap, but roughly half of VIDA's density
// in dense informal fabric. Neither is sufficient alone, so both are drawn.
const PMTOVT = 'https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/2026-07-22.0/buildings.pmtiles';
const TILEBASE = 'https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/2026-07-22.0/';
const PMTROAD  = TILEBASE + 'transportation.pmtiles';
const PMTDIV   = TILEBASE + 'divisions.pmtiles';
/* ---------- the non-building world ----------
   MEASURED, not assumed: every source below was range-requested with an Origin
   header before a single line of UI was written for it, because F60 found Open
   Buildings 2.5D and Copernicus DEM CORS-blocked after they had been designed in.

     overture base.pmtiles    206 + Access-Control-Allow-Origin: *   195 GB
     overture places.pmtiles  206 + Access-Control-Allow-Origin: *    19 GB
     ESA WorldCover COG       206 but NO CORS HEADER  -> UNUSABLE

   That last line is why land cover here is Overture's vector `land_cover`
   rather than WorldCover's raster: the better-known product simply cannot be
   read from a browser, and a layer we cannot fetch is not a layer.
   Read from the PMTiles metadata rather than guessed:
     base   z0-13  bathymetry, infrastructure, land, land_cover, land_use, water
     places z14    place */
const PMTBASE  = TILEBASE + 'base.pmtiles';
const PMTPLACE = TILEBASE + 'places.pmtiles';

/* ---------- reading a JSON string property from inside the style ----------
   Several Overture fields are JSON serialised into a single string: `names`,
   `taxonomy`, `local_type`. Pulling a value out of one used to mean decoding tiles
   in JavaScript and drawing a hand-rolled overlay, which threw away MapLibre's zoom
   handling, placement and collision - that is what made labels pile up in corners.
   String expressions do it inside the style instead, so rendering stays native. */
function pick(tok, prop){
  return ['let', 'p', ['index-of', tok, ['coalesce', ['get', prop], '']],
    ['case', ['>=', ['var','p'], 0],
      ['let', 's', ['+', ['var','p'], tok.length],
        ['slice', ['coalesce', ['get', prop], ''], ['var','s'],
          ['+', ['var','s'],
            ['index-of', '"', ['slice', ['coalesce', ['get', prop], ''], ['var','s']]]]]],
      '']];
}

/* MEASURED over 15 cities (Cairo, Tokyo, Beijing, Moscow, Delhi, Bangkok, Seoul,
   Athens, Tehran, Paris, Lagos, Sao Paulo, Istanbul, Tel Aviv, Kyiv):
       divisions       60% carry names.common.en
       roads           39%
       POIs             0%  - places have no language map at all, only a primary name
   Adding a '*-Latn' romanisation rung lifts the readable share by ~0.1pt; nothing
   else in the data helps. So the rest falls back to the local name, exactly as
   Google does in these cities. Readable-in-Latin-script works out at 82% of
   divisions, 70% of roads, 66% of POIs - the residue is Greek, Persian, Japanese,
   Korean, Thai and Hebrew, and no expression can invent a translation. */
const NAME = ['let', 'en', pick('"en":"', 'names'),
  ['case', ['!=', ['var','en'], ''], ['var','en'],
    ['let', 'la', pick('-Latn":"', 'names'),
      ['case', ['!=', ['var','la'], ''], ['var','la'],
        ['coalesce', ['get', '@name'], '']]]]];

// Overture's POI taxonomy is a JSON string whose `hierarchy` array starts with one
// of exactly 13 top-level groups (counted over 57,308 POIs in six cities). That is
// the grouping the icon colours key off.
/* ---------- label hierarchy ----------
   One builder so every label layer shares the same halo, fade and padding, and the
   differences between them stay visible as data rather than buried in repetition. */
// text colour per layer, [dark theme, light theme]
/* Script test. U+0250 sits above Latin and Latin Extended and below Greek,
   Cyrillic, Arabic, Hebrew, Thai, CJK and Hangul, so a plain code-point comparison
   separates readable names from unreadable ones. VERIFIED in the browser over
   Imbaba: 19 Latin / 36 non-Latin, summing exactly to the 55 named features in view.
   Every character is tested, not just the first, because MIXED names exist - one
   reading 'Pery Air ...' passed a first-character test and still drew Arabic.
   Slicing past the end of a string yields '', which compares below the threshold,
   so short names are unaffected. */
const LATIN_MAX = '\u0250';
const isLatinAll = e => ['all'].concat(
  Array.from({length:64}, (_, i) => ['<', ['slice', e, i, i+1], LATIN_MAX]));

/* ---------- romanisation ----------
   Dropping every name without an English variant left Athens, Tehran and Moscow
   almost blank - 1.2% of Athens streets survived. Most of those scripts are
   alphabets, so they convert character by character. This is TRANSLITERATION, not
   translation: a Greek street comes out 'Odos Ermou', not 'Hermes Street'. That is
   the same thing Google does for these scripts, and it is the difference between a
   name you can read aloud and match to a sign, and no name at all.

   MapLibre has no string-replace, but `match` compiles to a hash lookup, so one
   match per character position romanises the whole string in 48 lookups. The table
   is written once and the expression built from it at load, which keeps the file
   small.

   NOT covered, and it cannot be with a character table: Chinese and Japanese Han
   need a per-word dictionary, and Korean syllables are 11,172 precomposed code
   points. Those names still blank out. */
const ROMAN = {
 // Greek
 'α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k',
 'λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t',

   The official tile index is a 366 MB GeoPackage, far too large to ship. The tile
   NAME is derivable from z11 slippy coordinates instead - verified on four
   continents - so no index is needed. */
function heightTile(lon, lat){
  const n = 2**11;
  const x = Math.floor((lon+180)/360*n);
  const y = Math.floor((1 - Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n);
  // Both numbers are ZERO-PADDED to 4 digits: L15-0585E-0954N.tif.
  // Without padding this silently worked only where both happened to be 4 digits
  // (Cairo, Lagos, Nairobi) and returned "no data" everywhere else - Lima, Sao Paulo,
  // Sydney and Jakarta all failed until this was found.
  const pad = v => String(v).padStart(4,'0');
  return `L15-${pad(x)}E-${pad(n-1-y)}N.tif`;
}
/* ---------- geometry, computed client-side so it works ANYWHERE ----------

   touching-neighbour count are derived from the streamed tile geometry itself. */
const R_EARTH = 6378137;
function ringMetres(ring, lat0){
  const kx = Math.cos(lat0*Math.PI/180) * 111320, ky = 110540;
  return ring.map(([x,y]) => [x*kx, y*ky]);
}
function polyArea(ring){           // shoelace, metres^2
  let a = 0;
  for(let i=0, n=ring.length; i<n; i++){
    const [x1,y1] = ring[i], [x2,y2] = ring[(i+1)%n];
    a += x1*y2 - x2*y1;
  }
  return Math.abs(a/2);
}
function polyPerim(ring){
  let p = 0;
  for(let i=0, n=ring.length; i<n; i++){
    const [x1,y1] = ring[i], [x2,y2] = ring[(i+1)%n];
    p += Math.hypot(x2-x1, y2-y1);
  }

  if(g.type === 'Polygon') return g.coordinates[0];
  if(g.type === 'MultiPolygon') return g.coordinates[0][0];
  return null;

  const id = featKey(f);
  const own = geomStats(f);
  if(!id || !own) return own ? {...own, parts:1, partial:false} : null;
  const parts = idx ? (idx.get(id) || [f]) : all.filter(o => featKey(o) === id);
  if(parts.length < 2) return {...own, parts:1, partial:false};
  let area = 0, best = own;
  for(const q of parts){
    const g = geomStats(q); if(!g) continue;
    area += g.area;
    if(g.area > best.area) best = g;
  }
  return {area, perim: best.perim, compact: best.compact, lat0: best.lat0,
          parts: parts.length, partial: true};
}
function bboxOf(ring){
  let w=180,s=90,e=-180,n=-90;
  for(const [x,y] of ring){ if(x<w)w=x; if(x>e)e=x; if(y<s)s=y; if(y>n)n=y; }
  return [w,s,e,n];
}
/* Touching neighbours — EXACT.
   bbox overlap only shortlists candidates; each survivor gets a real segment-to-
   segment distance test. Affordable because this runs once for the clicked building,
   not for every pair on screen. */
function segDist(p1,p2,p3,p4){
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  function ptSeg(p,a,b){
    const vx=b[0]-a[0], vy=b[1]-a[1], wx=p[0]-a[0], wy=p[1]-a[1];
    const L=vx*vx+vy*vy; if(L===0) return d(p,a);
    let t=(wx*vx+wy*vy)/L; t=Math.max(0,Math.min(1,t));
    return d(p,[a[0]+t*vx, a[1]+t*vy]);
  }
  const o=(a,b,c)=>Math.sign((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]));
  if(o(p1,p2,p3)!==o(p1,p2,p4) && o(p3,p4,p1)!==o(p3,p4,p2)) return 0;
  return Math.min(ptSeg(p1,p3,p4), ptSeg(p2,p3,p4), ptSeg(p3,p1,p2), ptSeg(p4,p1,p2));
}
function ringsWithin(rA, rB, lat0, tol){
  const A=ringMetres(rA,lat0), B=ringMetres(rB,lat0);
  for(let i=0;i<A.length-1;i++)
    for(let j=0;j<B.length-1;j++)
      if(segDist(A[i],A[i+1],B[j],B[j+1]) <= tol) return true;
  return false;
}
function touchingCount(f, all){
  const ring = outerRing(f); if(!ring) return null;
  const [w,s,e,n] = bboxOf(ring);
  const lat0 = (s+n)/2;
  const dx = 1.0/(Math.cos(lat0*Math.PI/180)*111320), dy = 1.0/110540;
  const TOL = 0.6;
  let c = 0; const seen = new Set();
  for(const o of all){
    const oid = featKey(o);
    if(oid && (oid === featKey(f) || seen.has(oid))) continue;
    const r2 = outerRing(o); if(!r2) continue;
    const [w2,s2,e2,n2] = bboxOf(r2);
    if(w2 > e+dx || e2 < w-dx || s2 > n+dy || n2 < s-dy) continue;
    if(ringsWithin(ring, r2, lat0, TOL)){ c++; if(oid) seen.add(oid); }
  }
  return c;
}

/* geotiff.js is 104 KB and is only needed once someone clicks a building, so it is
   fetched on that click rather than on every page load. */
let geotiffPromise = null;
function loadGeoTIFF(){
  if(!geotiffPromise) geotiffPromise = new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = 'https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js';
    el.onload = () => res(window.GeoTIFF);
    el.onerror = () => { geotiffPromise = null; rej(new Error('geotiff.js failed to load')); };
    document.head.appendChild(el);
  });
  return geotiffPromise;
}
const tiffCache = {};
async function heightAt(lon, lat, quarter){
  const f = heightTile(lon, lat);
  const url = MSH.replace('{q}', quarter).replace('{f}', f);
  try{
    const GT = await loadGeoTIFF();
    if(!tiffCache[url]) tiffCache[url] = await GT.fromUrl(url);
    const tif = await tiffCache[url];
    const img = await tif.getImage();
    const [ox,oy] = img.getOrigin(), [rx,ry] = img.getResolution();
    const R = 20037508.342789244;
    const mx = lon*R/180, my = Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180)*R/180;
    const px = Math.round((mx-ox)/rx), py = Math.round((my-oy)/ry);
    if(px<0||py<0||px>=img.getWidth()||py>=img.getHeight()) return null;
    // MEASURED BIAS: the height band is diluted by each pixel's unbuilt fraction.
    // Over one neighbourhood, cells at 0-10% density read 2.4 m while cells at
    // 60-100% read 8.9 m. One centre pixel therefore under-reports badly wherever
    // the grid straddles open ground. Sample a window, keep only built-up cells.
    const K = 5, x0 = Math.max(0,px-K), y0 = Math.max(0,py-K);
    const x1 = Math.min(img.getWidth(), px+K+1), y1 = Math.min(img.getHeight(), py+K+1);
    const d = await img.readRasters({window:[x0,y0,x1,y1]});
    const dens = d[0], hh = d[1];
    const pairs = [];
    for(let i=0;i<hh.length;i++) if(hh[i] >= 0 && dens[i] > 0) pairs.push([hh[i]*100, dens[i]]);
    if(!pairs.length) return null;
    const dense = pairs.filter(q => q[1] >= 0.30);
    const use = dense.length >= 3 ? dense : pairs;
    const vals = use.map(q=>q[0]).sort((a,b)=>a-b);
    const med = vals[Math.floor(vals.length/2)];
    const localDens = pairs.reduce((a,q)=>a+q[1],0)/pairs.length;
    return {height: med, density: localDens, n: use.length, gated: dense.length >= 3};
  }catch(e){ return null; }
}

/* ---------- theme ----------
   The page follows the OS by default; this overrides it, because a dark map is the
   sensible default for satellite work and the OS setting often disagrees. */
let dark = !window.matchMedia('(prefers-color-scheme: light)').matches;
function applyTheme(){
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  if(window.map && map.getLayer('bld-line')){
    map.setPaintProperty('bld-line','line-color', dark ? '#5aa9e6' : '#0b60a8');
    map.setPaintProperty('bld-fill','fill-color', dark ? '#5aa9e6' : '#0b60a8');
    // BUG THIS FIXES: 'place-lbl' stopped existing when the labels were rebuilt, so
    // this loop matched nothing and the light theme left every label white on white.
    // Driving it off the generated layer list means it cannot drift again.
    for(const id of LBL_IDS) if(map.getLayer(id)){
      map.setPaintProperty(id, 'text-color', lblInk(id, dark));

        dark ? 'rgba(4,10,16,.80)' : 'rgba(255,255,255,.92)');
    }
  }
  const b = document.getElementById('theme'); if(b) b.textContent = dark ? 'Light' : 'Dark';
}
on('theme','click',()=>{ dark=!dark; applyTheme(); });
applyTheme();

/* ---------- layer stack ----------
   ONE config drives the checkboxes, the visibility calls and the credit line.
   applyTheme once iterated a hard-coded layer id that had stopped existing, so
   the light theme silently left labels white on white; anything that can drift
   from the style is now generated FROM the style's own layer ids. */
const LAYERS = [
  {key:'buildings', label:'Buildings',   src:'VIDA + Overture',
   ids:['bld-fill','bld-line','ovt-fill','ovt-line'], on:true,  dot:'#5aa9e6'},
  {key:'water',     label:'Water',       src:'Overture',
   ids:['wat-fill','wat-line'],          on:false, dot:'#2d7fd3'},
  {key:'landcover', label:'Land cover',  src:'Overture',
   ids:['lc-fill','land-fill'],          on:false, dot:'#2f7d4f'},
  {key:'landuse',   label:'Land use',    src:'Overture',
   ids:['lu-fill','lu-line'],            on:false, dot:'#c07a5a'},
  {key:'infra',     label:'Infrastructure', src:'Overture',
   ids:['infra-line'],                   on:false, dot:'#e0a34a'},
  {key:'roads',     label:'Road names',  src:'Overture',
   ids:['road-major','road-minor'],      on:true,  dot:'#eef5fb'},
];
function setLayer(cfg, on){
  cfg.on = on;
  for(const id of cfg.ids)
    if(map.getLayer(id)) map.setLayoutProperty(id,'visibility', on?'visible':'none');
  const el = document.querySelector(`.lyr[data-key="${cfg.key}"]`);
  if(el) el.setAttribute('aria-pressed', on ? 'true' : 'false');
}
function buildLayerUI(){
  const host = document.getElementById('lyrlist'); if(!host) return;
  host.innerHTML = LAYERS.map(c =>
    `<div class="lyr" role="button" tabindex="0" data-key="${c.key}"

       <i class="sw"></i><i class="dot" style="background:${c.dot}"></i>
       <span>${c.label}</span><span class="src">${c.src}</span>
     </div>`).join('');
  for(const c of LAYERS){
    const el = host.querySelector(`.lyr[data-key="${c.key}"]`);
    const hit = () => setLayer(c, !c.on);
    el.addEventListener('click', hit);
    // keyboard parity: a div with role=button must answer Enter and Space
    el.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); hit(); }
    });
  }
}

/* ---------- map labels on/off ---------- */
let labelsOn = true;
on('labels','click',()=>{

/* ---------- which years are actually different pictures? ----------
   MEASURED over one dense Imbaba tile by hashing the bytes: 2014, 2015 and 2016 are
   the SAME image, and so are 2025 and 2026 - 13 year options, 10 real captures. That
   is why moving the slider sometimes changed nothing, which looked like a bug in the
   app and was in fact the archive.

   Esri redirects each release id to whichever capture actually covers the tile, so
   which years collide DEPENDS ON WHERE YOU ARE and cannot be baked in at build time.
   fetch() exposes the post-redirect URL, so the capture is resolved for the tile
   under the map centre and years sharing an id are reported as the same photograph. */
const capCache = new Map();
function centreTile(){
  const c = map.getCenter(), z = Math.min(Math.max(Math.round(map.getZoom()), 10), 17);
  const n = 2 ** z;
  return {z, x: Math.floor((c.lng + 180) / 360 * n),
          y: Math.floor((1 - Math.asinh(Math.tan(c.lat * Math.PI/180)) / Math.PI) / 2 * n)};
}
async function captureOf(year, t){
  const key = year + '/' + t.z + '/' + t.x + '/' + t.y;
  if(capCache.has(key)) return capCache.get(key);
  const url = wbUrl(year).replace('{z}', t.z).replace('{x}', t.x).replace('{y}', t.y);
  let id = null;
  try{
    const r = await fetch(url);
    if(r.ok){ const m = /\/tile\/(\d+)\//.exec(r.url); id = m ? m[1] : null; }
  }catch(e){ id = null; }
  capCache.set(key, id);
  return id;
}
let capSeq = 0;
async function reportCapture(){
  const seq = ++capSeq, t = centreTile(), year = YEARS[yearIdx];
  const id = await captureOf(year, t);
  if(seq !== capSeq || !id) return;             // a newer request overtook this one
  const same = [];
  for(const y of YEARS){
    if(y === year) continue;
    const other = capCache.get(y + '/' + t.z + '/' + t.x + '/' + t.y);
    if(other && other === id) same.push(y);
  }
  const el = document.getElementById('capnote');
  if(!el) return;
  el.textContent = same.length
    ? 'same photograph as ' + same.join(', ') + ' here'
    : '';
}
// resolve the neighbours quietly so a collision can be reported the moment it matters
async function warmCaptures(){
  const t = centreTile();
  for(const y of YEARS) await captureOf(y, t);
  reportCapture();
}

/* ---------- building vintage vs imagery year ----------
   MEASURED: the building layer does NOT change with the slider - 3,966 buildings
   with identical ids at both 2014 and 2026. It is one snapshot, sourced 2022-2024.
   So on old imagery you are looking at TODAY'S buildings over YESTERDAY'S ground,
   and some will sit on land that was still empty. Saying so is the fix; pretending
   otherwise is what made the map look wrong. */
const BLD_VINTAGE = 2023;
function vintageOffset(){ return YEARS[yearIdx] - BLD_VINTAGE; }
function vintageNote(){
  const d = vintageOffset();
  if(Math.abs(d) <= 1) return '';
  return `<br><span style="color:var(--estimated)">outlines are ~${BLD_VINTAGE}, `
       + `imagery is ${YEARS[yearIdx]} — ${Math.abs(d)} years apart, so some buildings `
       + `shown may not have existed yet</span>`;
}

/* ---------- bottom sheet (phones) ----------
   Three snap points instead of one fixed height, so the map is usable and a long
   record is readable without fighting a cramped scroll box. Dragging the handle
   resizes; tapping it cycles. Selecting a building auto-expands to half. */
const SNAPS = [16, 45, 88];        // vh
let snapIdx = 1;
const isPhone = () => window.matchMedia('(max-width:820px)').matches;
function setSheet(i, animate=true){
  snapIdx = Math.max(0, Math.min(SNAPS.length-1, i));
  const el = document.documentElement;
  if(!animate) document.querySelector('aside').style.transition = 'none';
  el.style.setProperty('--sheet', SNAPS[snapIdx] + 'vh');
  if(!animate) requestAnimationFrame(()=>{ document.querySelector('aside').style.transition = ''; });
  if(window.map) setTimeout(()=>map.resize(), 240);
}
(function initSheet(){
  const grab = document.getElementById('grab');
  if(!grab) return;
  setSheet(1, false);
  let startY = null, startVh = null, moved = false;
  const vh = () => window.innerHeight / 100;
  grab.addEventListener('pointerdown', e=>{
    startY = e.clientY; startVh = SNAPS[snapIdx]; moved = false;
    grab.setPointerCapture(e.pointerId);
    document.querySelector('aside').style.transition = 'none';
  });
  grab.addEventListener('pointermove', e=>{
    if(startY === null) return;
    const dv = (startY - e.clientY) / vh();
    if(Math.abs(dv) > 1) moved = true;
    const next = Math.max(SNAPS[0], Math.min(SNAPS[SNAPS.length-1], startVh + dv));
    document.documentElement.style.setProperty('--sheet', next + 'vh');
  });
  grab.addEventListener('pointerup', e=>{
    if(startY === null) return;
    document.querySelector('aside').style.transition = '';
    const cur = parseFloat(getComputedStyle(document.documentElement)
                  .getPropertyValue('--sheet')) || SNAPS[snapIdx];
    if(!moved){ setSheet((snapIdx + 1) % SNAPS.length); }
    else {
      // snap to whichever stop is nearest where the finger stopped
      let best = 0, bd = 1e9;
      SNAPS.forEach((v,i)=>{ const d = Math.abs(v - cur); if(d < bd){ bd = d; best = i; } });
      setSheet(best);
    }
    startY = null;
  });
  window.addEventListener('resize', ()=>{ if(isPhone()) setSheet(snapIdx, false); });
})();

/* ---------- de-duplication ----------
   MEASURED at z17, share of Overture polygons sitting on a building the other
   source had already drawn: Imbaba 74%, Cairo 90%, Lagos 71%. Two outlines for one
   roof, drawn in the same colour, is what read as boxes stacked on a building.

   Neither source can simply be dropped, because which one is better flips by
   place: VIDA has 634 buildings over Imbaba against Overture's 208, but 32 over
   Paris against Overture's 253, and none at all over Beijing. So the denser source
   in the current view wins and only the OVERLAPPING polygons of the other are
   hidden - the rest still fill real gaps.

   Nothing is removed inside a source: within-source duplication measured ZERO at
   IoU>0.6 across all six cities. An earlier centroid-in-bbox test said 41% for
   Imbaba, but that fires on any neighbour in dense fabric and was wrong. */
const SRC_OF = {'bld-fill':['bld', BLD_LAYER], 'ovt-fill':['ovt','building']};
const DUP_IOU = 0.3;      // bbox intersection-over-union; will not fire on a neighbour
const DUP_IOU_LOW = 0.12; // floor for the tighter centre-and-size rule below
const CELL = 0.0004;      // ~40 m spatial hash

// the idle handler queries once and both consumers read the same array
let lastQuery = null;
function queryBuildings(){
  return map.queryRenderedFeatures({layers:BLD_LAYERS.filter(l=>map.getLayer(l))});
}
function bboxesOf(layer, pool){
  const m = new Map();
  for(const f of (pool ? pool.filter(x=>x.layer.id===layer)
                       : map.queryRenderedFeatures({layers:[layer]}))){
    if(f.id == null || !f.geometry) continue;
    const g = f.geometry;
    const rings = g.type === 'Polygon' ? g.coordinates
                : g.type === 'MultiPolygon' ? (g.coordinates[0] || []) : null;
    if(!rings || !rings[0]) continue;
    let b = m.get(f.id);
    if(!b) m.set(f.id, b = {id:f.id, x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity});
    // tiles clip geometry, so one building can arrive in pieces - union them
    for(const pt of rings[0]){
      if(pt[0]<b.x0) b.x0=pt[0]; if(pt[0]>b.x1) b.x1=pt[0];
      if(pt[1]<b.y0) b.y0=pt[1]; if(pt[1]>b.y1) b.y1=pt[1];
    }
  }
  return [...m.values()];
}
// A second, tighter rule for the near-misses. The two sources trace the same roof
// slightly differently, so a genuine duplicate can share as little as 15% of its
// bounding box - which is also roughly what two ADJACENT buildings share, hence the
// extra conditions: one centre must fall inside the other, and the two must be
// comparable in size. Neighbours fail both.
function centreIn(a, b){
  const cx = (a.x0+a.x1)/2, cy = (a.y0+a.y1)/2;
  return cx>=b.x0 && cx<=b.x1 && cy>=b.y0 && cy<=b.y1;
}
function areaOf(a){ return (a.x1-a.x0)*(a.y1-a.y0); }
function isDup(a, b){
  const i = iouOf(a, b);
  if(i > DUP_IOU) return true;
  if(i < DUP_IOU_LOW) return false;
  const r = areaOf(a) / Math.max(areaOf(b), 1e-12);
  // symmetric on purpose: with only centreIn(a,b) the test disagreed with itself
  // depending on argument order, and a pair slipped through in Athens and Tokyo
  return (centreIn(a,b) || centreIn(b,a)) && r > 0.4 && r < 2.5;
}
function iouOf(a, b){
  const w = Math.min(a.x1,b.x1) - Math.max(a.x0,b.x0);
  const h = Math.min(a.y1,b.y1) - Math.max(a.y0,b.y0);
  if(w <= 0 || h <= 0) return 0;
  const i = w*h, A = (a.x1-a.x0)*(a.y1-a.y0), B = (b.x1-b.x0)*(b.y1-b.y0);
  return i / (A + B - i);
}
let dupIds = {bld:new Set(), ovt:new Set()};
function dedupe(){
  for(const k in SRC_OF) map.removeFeatureState({source:SRC_OF[k][0], sourceLayer:SRC_OF[k][1]});
  dupIds = {bld:new Set(), ovt:new Set()};
  if(map.getZoom() < 12) return;
  const pool = lastQuery;
  const V = bboxesOf('bld-fill', pool), O = bboxesOf('ovt-fill', pool);
  if(!V.length || !O.length) return;             // nothing to conflict with
  const vidaWins = V.length >= O.length;
  const prim = vidaWins ? V : O, sec = vidaWins ? O : V;
  const key = vidaWins ? 'ovt' : 'bld';
  const [ssrc, slyr] = SRC_OF[vidaWins ? 'ovt-fill' : 'bld-fill'];
  const grid = new Map();
  for(const b of prim)
    for(let i=Math.floor(b.x0/CELL); i<=Math.floor(b.x1/CELL); i++)
    for(let j=Math.floor(b.y0/CELL); j<=Math.floor(b.y1/CELL); j++){
      const k2 = i+':'+j; let c = grid.get(k2); if(!c) grid.set(k2, c = []); c.push(b);
    }
  for(const a of sec){
    let hit = false;
    for(let i=Math.floor(a.x0/CELL); i<=Math.floor(a.x1/CELL) && !hit; i++)
    for(let j=Math.floor(a.y0/CELL); j<=Math.floor(a.y1/CELL) && !hit; j++)
      for(const b of (grid.get(i+':'+j) || [])) if(isDup(a,b)){ hit = true; break; }
    if(hit){
      dupIds[key].add(a.id);
      map.setFeatureState({source:ssrc, sourceLayer:slyr, id:a.id}, {dup:true});
    }
  }
}
// a hidden duplicate is still returned by queryRenderedFeatures, so the count,
// the export, the click target and the neighbour test all have to skip it too
const notDup = f => !(f.id != null && dupIds[f.source] && dupIds[f.source].has(f.id));

/* ---------- status ---------- */
function visibleBuildings(){
  if(map.getZoom()<12) return null;
  let f = (lastQuery || queryBuildings()).filter(notDup);
  // one entry per id: tiles clip geometry at boundaries, so the same building can
  // appear more than once (measured at 4.7% of features)
  // VIDA publishes no properties.id - only bf_source, confidence and area - so
  // keying on it stitched nothing and tile-boundary fragments were counted twice.
  // The vector-tile feature id is present on both sources, so fall back to it.
  const seen=new Set(); const out=[];
  for(const x of f){
    const id = x.properties.id || (x.id!=null ? x.source+':'+x.id : null);
    if(id && seen.has(id)) continue;
    if(id) seen.add(id);
    out.push(x);
  }
  return out;
}
function centroid(f){
  const g=f.geometry; if(!g) return null;
  const rings = g.type==='Polygon'?g.coordinates:(g.coordinates||[])[0];
  if(!rings||!rings[0]) return null;
  let sx=0,sy=0,n=0; for(const p of rings[0]){sx+=p[0];sy+=p[1];n++;}
  return n?[sx/n,sy/n]:null;
}
function refresh(){
  const el=document.getElementById('status');
  if(map.getZoom()<12){
    el.innerHTML='Zoomed out too far for buildings — '
      + '<a href="#" id="zin" style="color:var(--accent)">zoom in</a>'
      + ' <span style="color:var(--faint)">(needs level 12+)</span>';
    const a=document.getElementById('zin');
    if(a) a.onclick=(ev)=>{ev.preventDefault(); map.easeTo({zoom:15,duration:600});};
    return;
  }
  const f=visibleBuildings()||[];
  const idx=partsIndex(f);
  const areas=[]; for(const x of f){ const g=geomStatsWhole(x,f,idx); if(g) areas.push(g.area); }
  areas.sort((a,b)=>a-b);
  const med = areas.length? areas[Math.floor(areas.length/2)] : null;
  const dens = (()=>{
    const b = map.getBounds();
    const km2 = (b.getEast()-b.getWest())*Math.cos(map.getCenter().lat*Math.PI/180)*111.320
              * (b.getNorth()-b.getSouth())*110.540;
    return km2>0 ? f.length/km2 : null;
  })();
  el.innerHTML =
    `<b>${f.length.toLocaleString()}</b> buildings in view`
    + ` · imagery <b>${YEARS[yearIdx]}</b>`
    + (med!=null? `<br>median footprint <b>${med.toFixed(0)} m²</b>`:'')
    + (dens!=null? ` · <b>${dens.toFixed(0)}</b> per km²`:'')
    + vintageNote()
    + (f.length? ` · <a href="#" id="dl" style="color:var(--accent)">export</a>`:'');
  const a=document.getElementById('dl');
  if(a) a.onclick=(ev)=>{ ev.preventDefault(); exportVisible(f); };
}
map.on('moveend', ()=>{ lastQuery = null; refresh(); });
// setFeatureState repaints, which fires idle again; keying on the view stops the loop
let lastView = '';
map.on('idle', ()=>{
  const c = map.getCenter();
  lastQuery = queryBuildings();
  /* The feature COUNT is part of the key, not just the position. Keying on position
     alone meant that tiles finishing after the first idle were never de-duplicated -
     a sweep of 15 cities found 19 surviving overlaps that way, all of them in views
     where tiles landed late. */
  const k = map.getZoom().toFixed(2)+'|'+c.lng.toFixed(5)+'|'+c.lat.toFixed(5)
          + '|' + lastQuery.length;
  if(k !== lastView){ lastView = k; dedupe(); }
  refresh();
  lastQuery = null;
});

/* ---------- population ----------
   Every global population raster tested (WorldPop, Kontur, GHS-POP) is CORS-blocked,
   so a browser cannot read one. What CAN be computed anywhere is each building's
   SHARE of the local built volume (area x floors). Supply a known total for the view
   - a census figure, a district statistic - and it is distributed by that share.
   This is an allocation, never a measured headcount. */
let areaPop = null;
// The population input was removed from the UI; population is reported as a share of
// local built volume instead. `on()` is used everywhere below so a missing element is
// a no-op rather than a script-killing TypeError.
function on(id, ev, fn){ const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); }
async function popShare(f, all){
  const gs = geomStats(f); if(!gs) return null;
  const c = centroid(f); if(!c) return null;
  const h = await heightAt(c[0], c[1], '2023q4');
  const floors = h ? Math.max(1, Math.round(h.height/3)) : 1;
  const mine = gs.area * floors;
  // Total volume across the view, using ONE height reading for the whole view: the
  // 76 m grid cannot distinguish buildings within a block anyway, so per-building
  // raster reads here would be false precision at high cost.
  let total = 0;
  for(const o of all){ const g2 = geomStats(o); if(g2) total += g2.area * floors; }
  return total > 0 ? {share: mine/total, floors} : null;
}

/* ---------- export what is on screen, anywhere in the world ---------- */
function exportVisible(feats){
  const out = feats.map(f=>{
    const g = geomStatsWhole(f, feats), c = centroid(f), p = f.properties;
    let ds = p['@geometry_source'] || 'unknown';
    try{ const s0=JSON.parse(p.sources||'[]'); if(s0.length) ds=s0[0].dataset; }catch(_){}
    return {type:'Feature', geometry:f.geometry, properties:{
      id:p.id||null, source:ds,
      area_m2: g? +g.area.toFixed(1):null,
      perimeter_m: g? +g.perim.toFixed(1):null,
      compactness: g? +g.compact.toFixed(3):null,
      tile_pieces: g? g.parts:null,
      lon: c? +c[0].toFixed(6):null, lat: c? +c[1].toFixed(6):null,
      _note:'geometry is tile-simplified; height must be read per building in-app'
    }};
  });
  const blob = new Blob([JSON.stringify({type:'FeatureCollection',features:out})],
                        {type:'application/geo+json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='buildings_view.geojson';
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- click a building ---------- */
async function onBuildingClick(e){
  // the top hit may be a hidden duplicate - fall through to the one drawn beneath
  const f = (e.features || []).filter(notDup)[0];
  if(!f) return;
  const p = f.properties;
  if(map.getSource('selsrc'))
    map.getSource('selsrc').setData({type:'FeatureCollection',
      features:[{type:'Feature', geometry:f.geometry, properties:{}}]});
  const c=centroid(f)||[e.lngLat.lng,e.lngLat.lat];
  const body=document.getElementById('body');
  // On a phone, selecting a building while the sheet is collapsed would write the
  // record somewhere the user cannot see. Lift it to the half stop.
  if(typeof isPhone === 'function' && isPhone() && snapIdx === 0) setSheet(1);
  const srcs = (()=>{ try{ return JSON.parse(p.sources||'[]'); }catch(_){ return []; } })();
  const ds = p.bf_source || (srcs.length? srcs[0].dataset : (p['@geometry_source']||'unknown'));
  const lic = srcs.length? (srcs[0].license||'') : '';
  const rendered = map.queryRenderedFeatures({layers:BLD_LAYERS.filter(l=>map.getLayer(l))})
                      .filter(notDup);
  const gs = geomStatsWhole(f, rendered);
  const nb = touchingCount(f, rendered);
  const upd = srcs.length && srcs[0].update_time ? srcs[0].update_time.slice(0,10) : null;
  body.innerHTML = `
    <p class="bid">${p.id || (f.id!=null ? f.source+' · '+f.id : 'no identifier published')}</p>
    <span class="chip">${ds}</span>

    <div class="grp"><h2>Footprint · measured</h2><table>
      ${p.area_in_meters?`<tr><td class="k">Area</td><td class="v"><span class="num">${(+p.area_in_meters).toFixed(0)}</span> m²
        <span class="why">as published by the source</span></td></tr>`
        : (gs?`<tr><td class="k">Area</td><td class="v"><span class="num">${gs.area.toFixed(0)}</span> m²</td></tr>`:'')}
      ${p.confidence?`<tr><td class="k">Source confidence</td><td class="v"><span class="num">${(+p.confidence).toFixed(2)}</span></td></tr>`:''}
      ${gs?`<tr><td class="k">Perimeter</td><td class="v"><span class="num">${gs.perim.toFixed(0)}</span> m${
        gs.partial?'<span class="tag t-part">partial</span>':''}</td></tr>`:''}
      ${gs?`<tr><td class="k">Compactness</td><td class="v"><span class="num">${gs.compact.toFixed(2)}</span>${
        gs.partial?'<span class="tag t-part">partial</span>':''}</td></tr>`:''}
      ${nb!=null?`<tr><td class="k">Touching neighbours</td><td class="v"><span class="num">${nb}</span></td></tr>`:''}
      ${gs&&gs.partial?`<tr><td class="k">Split across tiles</td><td class="v"><span class="num">${gs.parts}</span> pieces
        <span class="why">Area is summed and correct. Perimeter and compactness come from
        the largest piece — a tile cut is not a real wall.</span></td></tr>`:''}
    </table></div>

    <div class="grp"><h2>Height &amp; occupancy · estimated</h2><table id="tbl">
      <tr id="hrow"><td class="k">Height 2023</td><td class="v"><span class="skel"></span></td></tr>
      <tr id="hrow0"><td class="k">Height 2020</td><td class="v"><span class="skel"></span></td></tr>
      <tr id="flr"><td class="k">Floors</td><td class="v"><span class="skel"></span></td></tr>
      ${p.num_floors?`<tr><td class="k">Floors (recorded)</td><td class="v"><span class="num">${p.num_floors}</span></td></tr>`:''}
      ${p.height?`<tr><td class="k">Height (recorded)</td><td class="v"><span class="num">${p.height}</span> m</td></tr>`:''}
    </table></div>

    <div class="grp"><h2>Location &amp; provenance</h2><table>
      <tr><td class="k">Longitude</td><td class="v"><span class="num">${c[0].toFixed(6)}</span></td></tr>
      <tr><td class="k">Latitude</td><td class="v"><span class="num">${c[1].toFixed(6)}</span></td></tr>
      ${p.class?`<tr><td class="k">Class</td><td class="v">${p.class}</td></tr>`:''}
      ${upd?`<tr><td class="k">Source updated</td><td class="v"><span class="num">${upd}</span></td></tr>`:''}
      ${lic?`<tr><td class="k">Licence</td><td class="v">${lic}</td></tr>`:''}
    </table></div>
  `;

  const [h23,h20] = await Promise.all([heightAt(c[0],c[1],'2023q4'), heightAt(c[0],c[1],'2020q4')]);
  const cell=(r,v,why)=>{
    const el=document.getElementById(r); if(!el) return;
    el.children[1].innerHTML = v==null
      ? `<span class="na">not available</span><span class="why">${why}</span>`
      : `${v.height.toFixed(1)} m <span class="tag t-est">est</span>
         <span class="why">~76 m grid · ${v.gated
             ? `median of ${v.n} built-up cells`
             : `<span style="color:var(--estimated)">only sparse cells (${v.n}) — unreliable</span>`}
           · local built fraction ${(v.density*100).toFixed(0)}%<br>
           Describes the block, not this roof. Against finer data over a test city
           this source read about 2 m low.</span>`;
  };
  cell('hrow',h23,'no height raster covers this point');
  cell('hrow0',h20,'no height raster covers this point');
  (async ()=>{
    const all = map.queryRenderedFeatures({layers:BLD_LAYERS.filter(l=>map.getLayer(l))})
                   .filter(notDup);
    const ps = await popShare(f, all);
    if(!ps) return;
    const tbl = document.getElementById('tbl'); if(!tbl) return;
    const pct = (ps.share*100).toFixed(4);
    tbl.insertAdjacentHTML('beforeend', areaPop
      ? `<tr><td class="k">People (allocated)</td><td class="v">${Math.round(areaPop*ps.share)}
         <span class="tag t-est">est</span><span class="why">${pct}% of the ${areaPop.toLocaleString()}
         you entered, shared by building volume — an allocation, not a headcount</span></td></tr>`
      : `<tr><td class="k">Share of area population</td><td class="v">${pct}%
         <span class="tag t-est">est</span><span class="why">by building volume. Enter a population
         for this area above to turn this into people.</span></td></tr>`);
  })();
  const fl = document.getElementById('flr');
  if(fl){
    const hh = (h23||h20);
    fl.children[1].innerHTML = hh
      ? `${Math.max(1,Math.round(hh.height/3))} <span class="tag t-est">est</span>
         <span class="why">height ÷ 3.0 m per storey — an estimate of an estimate</span>`
      : `<span class="na">not available</span><span class="why">needs a height value</span>`;
  }
  if(h23&&h20){
    const d=Math.abs(h23.height-h20.height);
    document.getElementById('tbl').insertAdjacentHTML('afterend',
      `<div class="note note-info"><strong>Change 2020→2023:</strong> ${(h23.height-h20.height>=0?'+':'')}${(h23.height-h20.height).toFixed(1)} m
       ${d<2?' — within noise for this grid':''}</div>`);
  }
  document.getElementById('tbl').insertAdjacentHTML('afterend',
    `<div class="note note-warn"><strong>Precision.</strong> Outlines are tile-simplified
     and height comes from a ~76 m grid, so both describe this building's block more than
     the building itself. Independent height sources for one test area differed by up to
     4.7 m — about 1.5 storeys.</div>`);
}
const BLD_LAYERS = ['bld-fill','ovt-fill'];
for(const L of BLD_LAYERS){
  map.on('click', L, onBuildingClick);
  map.on('mouseenter', L, ()=>{ map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave', L, ()=>{ map.getCanvas().style.cursor=''; clearHover(); });
  // hover highlight: filter the paired *-hover layer to the feature under the cursor
  map.on('mousemove', L, e=>{
    const f = (e.features || []).filter(notDup)[0];
    if(!f) return;
    const tgt = L === 'bld-fill' ? 'bld-hover' : 'ovt-hover';
    const other = L === 'bld-fill' ? 'ovt-hover' : 'bld-hover';
    const key = f.id !== undefined ? ['==',['id'], f.id]
                                   : ['==',['get','id'], f.properties.id || ''];
    map.setFilter(tgt, key);
    map.setFilter(other, ['==',['id'],'']);
  });
}
function clearHover(){
  for(const h of ['bld-hover','ovt-hover'])
    if(map.getLayer(h)) map.setFilter(h, ['==',['id'],'']);
}

/* ---------- place search ----------
   Shows several matches with their type and region rather than silently taking the
   first hit, and flies to a zoom where buildings are actually visible. */
const placeInput = document.getElementById('place');
const sugg = document.createElement('div');
sugg.id = 'sugg';
placeInput.parentElement.appendChild(sugg);

let searchTimer = null;
async function runSearch(q){
  if(!q || q.length < 2){ sugg.style.display='none'; return; }
  sugg.innerHTML = '<div class="s-item s-dim">Searching…</div>';
  sugg.style.display = 'block';
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&q='
                          + encodeURIComponent(q));
    const j = await r.json();
    if(!j.length){ sugg.innerHTML = '<div class="s-item s-dim">No match</div>'; return; }
    sugg.innerHTML = j.map((h,i)=>{
      const parts = h.display_name.split(',');
      const head = parts[0].trim();
      const tail = parts.slice(1,3).join(',').trim();
      const kind = (h.type||h.class||'').replace(/_/g,' ');
      return `<div class="s-item" data-i="${i}">
        <span class="s-name">${head}</span>
        <span class="s-kind">${kind}</span>
        <span class="s-where">${tail}</span></div>`;
    }).join('');
    [...sugg.querySelectorAll('.s-item')].forEach(el=>{
      el.onclick = ()=>{
        const h = j[+el.dataset.i];
        const b = h.boundingbox.map(Number);
        const spanKm = (b[1]-b[0])*110.54;
        // Small places: fly close. Large regions: fit, but never below the zoom
        // where buildings render.
        if(spanKm < 3) map.flyTo({center:[+h.lon,+h.lat], zoom:16, duration:900});
        else map.fitBounds([[b[2],b[0]],[b[3],b[1]]],
                           {maxZoom:16, minZoom:13, padding:30, duration:900});
        sugg.style.display='none';
        placeInput.value = h.display_name.split(',')[0];
        placeInput.blur();
      };
    });
  }catch(err){ sugg.innerHTML = '<div class="s-item s-dim">Search unavailable</div>'; }
}
on('place','input', e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(()=>runSearch(q), 350);
});
on('place','keydown', e=>{
  if(e.key === 'Enter'){ clearTimeout(searchTimer); runSearch(e.target.value.trim()); }
  if(e.key === 'Escape'){ sugg.style.display='none'; }
});
document.addEventListener('click', e=>{
  if(!placeInput.parentElement.contains(e.target)) sugg.style.display='none';
});

/* keyboard: "/" focuses search, Escape cancels a selection in progress */
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){
    e.preventDefault(); document.getElementById('place').focus();
  }
  if(e.key === 'Escape') document.activeElement.blur();
});

on('about','click', e=>{
  e.preventDefault();
  document.getElementById('body').innerHTML = `
    <div class="grp"><h2>What this shows</h2><table>
      <tr><td class="k">Buildings</td><td class="v">Google Open Buildings + Microsoft
        Global ML Footprints, combined by VIDA (CC BY-4.0 / ODbL)
        <span class="why">the full union of both products, 2.7 billion footprints,
        streamed as vector tiles — nothing is stored in this file. Measured over one
        dense test area it carries 1,071 buildings where a conflated alternative
        carried 342.</span></td></tr>
      <tr><td class="k">Road names</td><td class="v">Overture Maps</td></tr>
      <tr><td class="k">Height</td><td class="v">Microsoft (CDLA-2.0)
        <span class="why">~76 m grid, 2020 Q4 and 2023 Q4, read live from cloud-optimised
        rasters</span></td></tr>
      <tr><td class="k">Imagery</td><td class="v">Esri World Imagery
        <span class="why">13 captures, 2014–2026, under its terms of service</span></td></tr>
      <tr><td class="k">Place search</td><td class="v">Nominatim / OpenStreetMap</td></tr>
    </table></div>
    <div class="note note-warn"><strong>Attribution is required</strong> by these licences.
    Keep this panel in any redistributed copy.</div>
    <div class="note note-info"><strong>What is measured vs estimated.</strong> Footprint
    geometry is measured from the tiles. Height, floors and population are estimated and
    labelled as such. Population is an allocation of a total you supply — never a headcount.</div>`;
});

map.on('load', refresh);
// applyTheme runs once before the style exists, so on a light-mode machine the label
// colours were never re-applied. Run it again once there are layers to colour.
map.on('load', applyTheme);
map.on('load', ()=>{ buildLayerUI(); for(const c of LAYERS) setLayer(c, c.on); });
</script>
